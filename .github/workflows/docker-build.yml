name: Build and Push to GHCR

on:
  push:
    branches:
      - develop
      - dev
      - main
      - production
    tags:
      - 'v*'

  repository_dispatch:
    types: [eaushadhi-plugin-updated, radiology-plugin-updated]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: care-ecosystem/care

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Compute tags/labels once, share across arch jobs ──────────────────
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      short_sha: ${{ steps.vars.outputs.SHORT_SHA }}
      no_cache: ${{ github.event_name == 'repository_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/care-ecosystem/care-backend
            ${{ env.REGISTRY }}/care-ecosystem/care-celery
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=${{ github.ref_name }}-${{ steps.vars.outputs.SHORT_SHA }}
            type=raw,value=${{ github.ref_name }}-${{ github.run_number }}-${{ steps.vars.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}

  # ── Job 2: Build per-arch images, push arch-suffixed tags ────────────────────
  build-matrix:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false          # let both arches attempt even if one fails
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm  # GitHub-hosted ARM runner

    outputs:
      # These are arch-keyed so the manifest job can pick them up
      amd64_digest: ${{ steps.export_digest.outputs.amd64_digest }}
      arm64_digest: ${{ steps.export_digest.outputs.arm64_digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        # Skip cache for repository_dispatch (plugin-triggered) builds
        if: github.event_name != 'repository_dispatch'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-${{ matrix.arch }}-buildx-

      - name: Build and push arch-specific image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/prod.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Push with an arch suffix — merged into the manifest list in Job 3
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: ${{ github.event_name != 'repository_dispatch' && 'type=local,src=/tmp/.buildx-cache' || '' }}
          cache-to:   ${{ github.event_name != 'repository_dispatch' && 'type=local,dest=/tmp/.buildx-cache,mode=max' || '' }}
          no-cache:   ${{ github.event_name == 'repository_dispatch' }}

      - name: Export digest for manifest job
        id: export_digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "${{ matrix.arch }}_digest=$DIGEST" >> $GITHUB_OUTPUT

  # ── Job 3: Combine arch digests → multi-arch manifest for every final tag ───
  create-manifest:
    name: Create Multi-Arch Manifest
    needs: [prepare, build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifests
        run: |
          AMD64_DIGEST="${{ needs.build-matrix.outputs.amd64_digest }}"
          ARM64_DIGEST="${{ needs.build-matrix.outputs.arm64_digest }}"

          # Iterate over every image:tag produced by metadata-action
          # and create a manifest list pointing at the two arch digests.
          echo "${{ needs.prepare.outputs.tags }}" | while IFS= read -r FULL_TAG; do
            [ -z "$FULL_TAG" ] && continue
            IMAGE="${FULL_TAG%%:*}"   # e.g. ghcr.io/care-ecosystem/care

            docker buildx imagetools create \
              --tag "$FULL_TAG" \
              "${IMAGE}@${AMD64_DIGEST}" \
              "${IMAGE}@${ARM64_DIGEST}"

            echo "✅ Pushed manifest: $FULL_TAG"
          done

      - name: Clean up arch-suffixed staging tags
        run: |
          # These were only needed as intermediaries for digest extraction
          # GHCR doesn't have a simple delete CLI — skip or add gh api call if desired
          echo "Arch-suffixed tags (${{ github.ref_name }}-${{ needs.prepare.outputs.short_sha }}-amd64/arm64) left in registry."
          echo "Delete them via GHCR UI or a gh api call if you want a clean tag list."

      - name: Summary
        run: |
          echo "## 🐳 Multi-Arch Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ needs.prepare.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.prepare.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
